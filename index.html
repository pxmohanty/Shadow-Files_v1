<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>SHADOW FILES — The Blackthorn Estate</title>
<style>:root {
  --bg-charcoal: #0c0e13;
  --bg-panel: #151922;
  --bg-panel-elevated: #1c222e;
  --border-subtle: #2a3242;
  --accent-burgundy: #7a2838;
  --accent-burgundy-bright: #9e354a;
  --accent-amber: #d99b43;
  --accent-amber-soft: rgba(217, 155, 67, 0.16);
  --text-primary: #eceae4;
  --text-secondary: #a2aab8;
  --status-success: #48a878;
  --status-danger: #c84b58;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Georgia', 'Times New Roman', serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-charcoal);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.55;
  overflow-x: hidden;
}

button,
input,
select {
  font-family: inherit;
  font-size: 0.92rem;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent-amber);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Subtle Ambient Rain */
.ambient-rain {
  pointer-events: none;
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(
    105deg,
    transparent,
    transparent 38px,
    rgba(255, 255, 255, 0.025) 39px,
    transparent 40px
  );
  z-index: 0;
}

/* Header */
.top-bar {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.5rem;
  background: rgba(16, 19, 26, 0.95);
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
  gap: 0.75rem;
}

.brand-block {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.brand-badge {
  background: var(--accent-burgundy);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.15rem 0.45rem;
  letter-spacing: 0.08em;
  border-radius: 3px;
}

.brand-title {
  font-size: 1.15rem;
  letter-spacing: 0.14em;
  font-weight: 700;
}

.brand-subtitle {
  font-size: 0.8rem;
  color: var(--accent-amber);
  letter-spacing: 0.06em;
}

.utility-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.save-indicator {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.55rem;
  border-radius: 3px;
  background: rgba(72, 168, 120, 0.14);
  color: var(--status-success);
  border: 1px solid rgba(72, 168, 120, 0.35);
}

.save-indicator.warn {
  background: rgba(217, 155, 67, 0.14);
  color: var(--accent-amber);
  border-color: var(--accent-amber);
}

/* Main Navigation */
.main-nav {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 0.35rem;
  padding: 0.6rem 1.5rem;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto;
}

.nav-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.5rem 0.85rem;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, color 0.15s ease;
}

.nav-tab:hover:not(:disabled) {
  background: var(--bg-panel-elevated);
  color: var(--text-primary);
}

.nav-tab.active {
  background: var(--bg-panel-elevated);
  color: var(--accent-amber);
  border-color: var(--accent-amber);
}

.nav-tab.locked-tab {
  opacity: 0.45;
  cursor: not-allowed;
}

.nav-counter {
  font-size: 0.72rem;
  background: rgba(255, 255, 255, 0.08);
  padding: 0.1rem 0.4rem;
  border-radius: 10px;
}

/* Workspace Layout */
.workspace {
  position: relative;
  z-index: 1;
  flex: 1;
  padding: 1.5rem;
  max-width: 1380px;
  width: 100%;
  margin: 0 auto;
}

.screen-grid.two-col {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 1.5rem;
}

.screen-grid.single-col {
  max-width: 920px;
  margin: 0 auto;
}

.panel-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 1.35rem;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
}

.panel-header {
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 0.75rem;
  margin-bottom: 1rem;
}

.section-tag {
  display: block;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  color: var(--accent-amber);
  margin-bottom: 0.25rem;
}

/* Intro Screen */
.intro-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 76vh;
}

.intro-hero-card {
  max-width: 680px;
  width: 100%;
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 2rem;
  text-align: center;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
}

.mansion-silhouette {
  width: 100%;
  height: auto;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  margin-bottom: 1.25rem;
}

.intro-kicker {
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  color: var(--accent-amber);
}

.intro-title {
  font-size: 2.5rem;
  letter-spacing: 0.16em;
  margin: 0.25rem 0;
}

.intro-subtitle {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--text-secondary);
  margin-bottom: 1rem;
}

.intro-hook {
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}

.intro-actions {
  display: flex;
  justify-content: center;
  gap: 0.85rem;
  flex-wrap: wrap;
}

/* Buttons */
.primary-cta-btn {
  background: var(--accent-burgundy);
  color: #fff;
  border: 1px solid var(--accent-burgundy-bright);
  padding: 0.7rem 1.25rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  border-radius: 4px;
  cursor: pointer;
}

.primary-cta-btn:hover {
  background: var(--accent-burgundy-bright);
}

.secondary-btn {
  background: var(--bg-panel-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  padding: 0.65rem 1.1rem;
  border-radius: 4px;
  cursor: pointer;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--bg-panel-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  padding: 0.38rem 0.65rem;
  border-radius: 4px;
  cursor: pointer;
}

.danger-btn {
  border-color: rgba(200, 75, 88, 0.5);
  color: #f09aa2;
}

.danger-cta-btn {
  background: var(--status-danger);
  color: #fff;
  border: none;
  padding: 0.65rem 1.15rem;
  border-radius: 4px;
  cursor: pointer;
}

.full-width {
  width: 100%;
}

/* Briefing & Objectives */
.meta-strip {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  background: var(--bg-panel-elevated);
  padding: 0.75rem;
  border-left: 3px solid var(--accent-amber);
  margin-bottom: 1rem;
  font-size: 0.88rem;
}

.narrative-passage {
  font-family: var(--font-serif);
  font-size: 1.02rem;
  line-height: 1.7;
  color: #dedad0;
  background: rgba(0, 0, 0, 0.22);
  padding: 1.1rem;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  margin-bottom: 1.25rem;
}

.objective-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin-bottom: 1.25rem;
}

.objective-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem;
  background: var(--bg-panel-elevated);
  border-radius: 4px;
  font-size: 0.9rem;
}

.objective-item.completed {
  color: var(--status-success);
}

.Lock-notice {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  padding: 0.75rem;
  background: var(--accent-amber-soft);
  border: 1px solid var(--accent-amber);
  border-radius: 4px;
  font-size: 0.84rem;
}

/* Crime Scene Blueprint */
.blueprint-map {
  position: relative;
  width: 100%;
  height: 360px;
  background: #0e131b;
  border: 1px solid #2e3b4e;
  border-radius: 6px;
  margin-bottom: 1rem;
  overflow: hidden;
  background-image: radial-gradient(#233044 1px, transparent 1px);
  background-size: 18px 18px;
}

.room-zone {
  position: absolute;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.28);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  padding: 0.35rem;
  pointer-events: none;
}

.zone-master {
  left: 3%;
  top: 6%;
  width: 22%;
  height: 45%;
}
.zone-study {
  left: 26%;
  top: 6%;
  width: 50%;
  height: 72%;
}
.zone-conservatory {
  left: 77%;
  top: 12%;
  width: 20%;
  height: 75%;
}
.zone-coatroom {
  left: 3%;
  top: 55%;
  width: 22%;
  height: 38%;
}

.hotspot-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  background: rgba(18, 22, 31, 0.92);
  color: var(--text-primary);
  border: 1px solid var(--accent-amber);
  border-radius: 16px;
  padding: 0.22rem 0.55rem;
  font-size: 0.74rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
}

.hotspot-pin.selected {
  background: var(--accent-amber);
  color: #000;
  font-weight: 700;
  z-index: 3;
}

.hotspot-pin.inspected:not(.selected) {
  border-color: var(--status-success);
}

.pin-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.hotspot-quick-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.Quick-chip {
  background: var(--bg-panel-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  padding: 0.35rem 0.65rem;
  border-radius: 4px;
  font-size: 0.8rem;
  cursor: pointer;
}

.Quick-chip.active {
  border-color: var(--accent-amber);
  color: var(--accent-amber);
}

.detail-section {
  margin-bottom: 1rem;
}

.detail-section h4 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 0.25rem;
}

.inference-highlight {
  background: var(--accent-amber-soft);
  border-left: 3px solid var(--accent-amber);
  padding: 0.65rem;
  border-radius: 3px;
}

.collected-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem;
  background: rgba(72, 168, 120, 0.14);
  border: 1px solid var(--status-success);
  border-radius: 4px;
  flex-wrap: wrap;
}

/* Evidence Locker */
.filter-bar {
  display: flex;
  gap: 0.65rem;
  margin-bottom: 1rem;
}

.text-input,
.select-input {
  background: var(--bg-charcoal);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  padding: 0.55rem 0.75rem;
  border-radius: 4px;
}

.text-input {
  flex: 1;
}

.evidence-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 0.75rem;
}

.evidence-card {
  text-align: left;
  background: var(--bg-panel-elevated);
  border: 1px solid var(--border-subtle);
  padding: 0.85rem;
  border-radius: 5px;
  color: var(--text-primary);
  cursor: pointer;
}

.evidence-card.selected {
  border-color: var(--accent-amber);
  background: rgba(217, 155, 67, 0.08);
}

.ev-card-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  font-size: 0.7rem;
}

.ev-cat-tag {
  color: var(--text-secondary);
  text-transform: uppercase;
}

.critical-pill {
  color: var(--accent-amber);
  font-weight: 700;
}

.ev-loc {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 0.25rem;
}

/* Suspects */
.suspect-roster {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.suspect-tab-card {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.65rem;
  background: var(--bg-panel-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 5px;
  color: var(--text-primary);
  text-align: left;
  cursor: pointer;
}

.suspect-tab-card.active {
  border-color: var(--accent-amber);
  background: rgba(217, 155, 67, 0.1);
}

.suspect-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-charcoal);
  border: 2px solid;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.suspect-tab-meta span {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.dossier-details {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  font-size: 0.88rem;
  background: rgba(0, 0, 0, 0.2);
  padding: 0.85rem;
  border-radius: 4px;
}

.dialogue-box {
  background: rgba(0, 0, 0, 0.28);
  border-left: 3px solid var(--accent-burgundy-bright);
  padding: 1rem;
  margin-bottom: 1rem;
  border-radius: 4px;
}

.dialogue-quote {
  font-family: var(--font-serif);
  font-size: 1rem;
  margin-bottom: 0.6rem;
}

.clue-note-banner {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.82rem;
  color: var(--accent-amber);
  background: var(--accent-amber-soft);
  padding: 0.5rem;
  border-radius: 4px;
}

.dialogue-options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.dialogue-option-btn {
  text-align: left;
  padding: 0.65rem 0.85rem;
  background: var(--bg-panel-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}

.dialogue-option-btn.confront-btn {
  border-color: rgba(217, 155, 67, 0.5);
}

.dialogue-option-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.lock-requirement {
  font-size: 0.74rem;
  color: var(--accent-amber);
}

/* Deductions & Timeline */
.comparison-slots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.85rem;
  margin: 1rem 0;
}

.slot-box label {
  display: block;
  font-size: 0.8rem;
  margin-bottom: 0.35rem;
  color: var(--text-secondary);
}

.feedback-banner {
  margin-top: 1rem;
  padding: 0.85rem;
  background: var(--bg-panel-elevated);
  border-left: 3px solid var(--accent-amber);
  border-radius: 4px;
}

.feedback-banner.success {
  border-left-color: var(--status-success);
  color: var(--status-success);
}

.deduction-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.deduction-card {
  background: var(--bg-panel-elevated);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--accent-amber);
  padding: 0.85rem;
  border-radius: 4px;
}

.ded-summary {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin: 0.25rem 0;
}

.timeline-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin: 1rem 0;
}

.timeline-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  background: var(--bg-panel-elevated);
  border: 1px solid var(--border-subtle);
  padding: 0.85rem;
  border-radius: 5px;
}

.tl-slot-number {
  font-weight: 700;
  color: var(--accent-amber);
  font-size: 1.1rem;
  min-width: 32px;
}

.tl-body {
  flex: 1;
}

.tl-meta-row {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.25rem;
  font-size: 0.75rem;
}

.tl-time-badge {
  background: var(--accent-burgundy);
  padding: 0.1rem 0.45rem;
  border-radius: 3px;
}

.tl-status-pill {
  color: var(--text-secondary);
}

.tl-controls {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

/* Accusation Form */
.accusation-form {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
  margin-top: 1rem;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 0.5rem;
}

.checkbox-card {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem;
  background: var(--bg-panel-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  font-size: 0.86rem;
  cursor: pointer;
}

.checkbox-card.checked {
  border-color: var(--accent-amber);
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  padding: 1rem;
}

.modal-dialog {
  max-width: 440px;
  width: 100%;
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 1.35rem;
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.65rem;
  margin-top: 1.25rem;
}

/* Responsive Breakpoints */
@media (max-width: 900px) {
  .screen-grid.two-col {
    grid-template-columns: 1fr;
  }
  .comparison-slots {
    grid-template-columns: 1fr;
  }
  .pin-label {
    display: none;
  }
}
